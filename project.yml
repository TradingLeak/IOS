name: VietMap

options:
  bundleIdPrefix: com.tradingleak
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  VietMap:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_NAME: VietMap
        PRODUCT_BUNDLE_IDENTIFIER: com.tradingleak.vietmap
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        # Không ký app: bản IPA tạo ra là "unsigned" (không cần tài khoản Apple).
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  VietMapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App/Tests
    dependencies:
      - target: VietMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tradingleak.vietmap.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VietMap.app/VietMap"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO

schemes:
  VietMap:
    build:
      targets:
        VietMap: all
        VietMapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VietMapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
