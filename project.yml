name: HelloIPA

options:
  bundleIdPrefix: com.tradingleak
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  HelloIPA:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_NAME: HelloIPA
        PRODUCT_BUNDLE_IDENTIFIER: com.tradingleak.helloipa
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        # Không ký app: bản IPA tạo ra là "unsigned".
        # Tắt ở đây để cả khi mở Xcode bằng GUI cũng không đòi Apple ID.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

    # Nếu cần thêm thư viện Swift Package, bỏ comment và khai báo:
    # packages:
    #   Alamofire:
    #     url: https://github.com/Alamofire/Alamofire
    #     from: 5.9.0
    # dependencies:
    #   - package: Alamofire

schemes:
  HelloIPA:
    build:
      targets:
        HelloIPA: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
